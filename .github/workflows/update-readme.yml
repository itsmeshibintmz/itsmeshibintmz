name: Waka - Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at 1:25 AM UTC daily — step 2 of 3 in the update chain
    # Must run AFTER readme-scribe (1:05 AM) which creates the waka markers
    # Order: readme-scribe (1:05) → waka-readme (1:25) → youtube (1:30)
    - cron: '25 1 * * *'

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: athul/waka-readme@8539bedb8277066fc9fe1b47d1f9b108eb866494 # v0.3.1
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
