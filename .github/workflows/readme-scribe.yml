name: Update README

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "templates/README.md.tpl"  # only re-run when the template itself changes
  schedule:
    # Runs at 1:05 AM IST (19:35 UTC) daily — step 1 of 3 in the update chain
    # Order: readme-scribe (1:05 IST) → waka-readme (1:25 IST) → youtube (1:30 IST)
    - cron: '35 19 * * *'

permissions:
  contents: write

jobs:
  markscribe:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: muesli/readme-scribe@5a187a2a36ef894335f17a7d01c32b0e28c6d948 # v0.1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - name: Inject dynamic age from birthday (June 26 1999)
        run: |
          AGE=$(python3 -c "
          from datetime import date
          bd = date(1999, 6, 26)
          today = date.today()
          age = today.year - bd.year - ((today.month, today.day) < (bd.month, bd.day))
          print(age)
          ")
          sed -i "s/I graduated with a degree/I'm $AGE years old and graduated with a degree/" README.md

      - name: Ensure waka and YouTube section markers exist
        run: |
          # Only inject markers if they don't already exist (idempotent)
          grep -q '<!--START_SECTION:waka-->' README.md || \
            sed -i 's/📊 \*\*\&nbsp;this week i spent my time on:\*\*/📊 **\&nbsp;this week i spent my time on:**\n\n<!--START_SECTION:waka-->\n<!--END_SECTION:waka-->/' README.md
          grep -q '<!-- YOUTUBE:START -->' README.md || \
            sed -i 's/📺\&nbsp;Latest YouTube Videos/📺\&nbsp;Latest YouTube Videos\n\n<!-- YOUTUBE:START -->\n<!-- YOUTUBE:END -->/' README.md

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          commit_message: 'chore: update generated README [skip ci]'
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
